name: Verify tracking

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Pin the authoritative schema fixture so a moving branch cannot change
      # the database under a tracking PR. Update with reviewed schema changes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ClashKingInc/DevKit
          ref: 381d3eaec5cd886438dcbe2403f198d640ed1933
          path: .ci-schema
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/verify.yml
      - name: Build tracking and verification commands
        run: go build ./...
      - name: Install schema migrator
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
      - name: Verify autoboard delivery
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-autoboards
      - name: Verify role tracking
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-role-tracking
      - name: Verify recorded Legend streaks
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-legend-streaks
      - name: Verify welcome panel delivery
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- env CLASHKING_WELCOME_E2E=1 go run ./cmd/verify-welcome-delivery
      - name: Verify countdown channel updates
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-countdowns
      - name: Verify capital raid history collection
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-raid-history
      - name: Verify automatic Discord war events
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-war-events

      - name: Verify Legend daily performance
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-legend-performance

      - name: Verify maintenance recovery and observation ordering
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run -race ./cmd/verify-tracking-state
      - name: Verify retained reminder webhook delivery
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-reminder-webhooks

      - name: Verify reminder global avatar fallback
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- env CLASHKING_E2E_GLOBAL_AVATAR=1 go run ./cmd/verify-reminder-webhooks

      - name: Verify giveaway migration cutover
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-giveaway-cutover

      - name: Verify all war types reach configured log threads
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-war-logs
      - name: Verify Reddit post and subscribed comment delivery
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-reddit-logs

      - name: Verify unknown Discord channel compatibility
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-gateway-channels

      - name: Verify notification scan and retry timing
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-mobile-scan

      - name: Verify reminder startup releases SQL reads
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run ./cmd/verify-reminder-startup

      - name: Verify clan ingestion and CWL completion
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- bash -c 'bash .ci-schema/scripts/schema-smoke.sh && go run ./cmd/verify-clan-tracking'

      - name: Verify discovery throughput and scan ordering
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run -race ./cmd/verify-war-throughput

      - name: Verify tracked-player batched throughput and commit ordering
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run -race ./cmd/verify-player-throughput

      - name: Verify raw Legend Discord delivery without profile requests
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run -race ./cmd/verify-legend-delivery
      - name: Verify repeated CWL snapshots
        run: bash .ci-schema/scripts/with-test-integration.sh --profile retained-api -- go run -race ./cmd/verify-cwl-snapshots
